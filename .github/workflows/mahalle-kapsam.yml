# Mahalle ve köy kapsam raporu (deneme): TÜİK mahalle/köy listesi ↔ OpenStreetMap sınır ve noktaları.
# Yalnız rapor üretir; yayın dalına (yayin) dokunmaz. Sonuç "mahalle-kapsam-sonuc" dalına yazılır.
name: Mahalle kapsam raporu

on:
  push:
    branches: [mahalle-kapsam]
    paths: ["scripts/mahalle/**", ".github/workflows/mahalle-kapsam.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahalle-kapsam
  cancel-in-progress: true

jobs:
  rapor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UA: "topografya-veri/1.0 (+https://github.com/topografya/veri)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçları kur
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -q osmium==4.0.2 shapely==2.0.6 pyproj==3.7.0 pyshp==2.3.1

      - name: OSM Türkiye verisini indir ve doğrula
        run: |
          mkdir -p girdi
          curl -fsSL -A "$UA" -o girdi/turkey.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          curl -fsSL -A "$UA" -o girdi/turkey.osm.pbf.md5 https://download.geofabrik.de/europe/turkey-latest.osm.pbf.md5
          (cd girdi && sed 's/turkey-latest.osm.pbf/turkey.osm.pbf/' turkey.osm.pbf.md5 | md5sum -c -)
          osmium fileinfo -g header.option.osmosis_replication_timestamp girdi/turkey.osm.pbf | tee girdi/zaman.txt

      - name: İdari sınırları ve yerleşim yerlerini süz
        run: |
          osmium tags-filter girdi/turkey.osm.pbf r/boundary=administrative -o girdi/idari.osm.pbf --overwrite
          osmium tags-filter girdi/turkey.osm.pbf r/boundary=administrative n/place w/place r/place -o girdi/yer.osm.pbf --overwrite
          ls -la girdi

      - name: İlçe poligonları (derle.py, resmî adlarla)
        run: python scripts/sinirlar/derle.py girdi/idari.osm.pbf build/ham --tarih "$(cut -c1-10 girdi/zaman.txt)"

      - name: Kapsam raporu
        run: |
          python scripts/mahalle/kapsam.py girdi/yer.osm.pbf build/ham/ilce-ham.geojson \
            scripts/nufus/ham/mahalle/medas_mahalle_2025_toplam.csv scripts/nufus/ham/mahalle/medas_koy_2025_toplam.csv rapor
          cp girdi/zaman.txt rapor/osm_zaman.txt

      - name: Sonucu dala yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sonuc && cp -r rapor /tmp/sonuc/
          git checkout --orphan mahalle-kapsam-sonuc
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/sonuc/rapor . && git add rapor
          git commit -qm "Mahalle kapsam raporu (OSM $(cut -c1-10 rapor/osm_zaman.txt))"
          git push -f origin mahalle-kapsam-sonuc
